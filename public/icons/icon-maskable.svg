<?xml version="1.0" encoding="UTF-8"?>
<!--
  Maskable PWA icon. Safe zone is the centered 80% circle (per
  https://w3c.github.io/manifest/#icon-masks). The wordmark is sized
  inside that zone so Android adaptive masks don't crop the logo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Afriklang">
  <rect width="512" height="512" fill="#00539F" />
  <text
    x="50%"
    y="54%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="240"
    fill="#FFFFFF"
  >A</text>
</svg>
